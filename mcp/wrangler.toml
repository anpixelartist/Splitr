name = "splitr-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# nodejs_compat: the MCP SDK imports a few node: built-ins.
# global_fetch_strictly_public: required by the OAuth library to fetch
# Client ID Metadata Documents (ChatGPT, Claude) safely.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# OAuth clients, grants and tokens (hashed / encrypted by the library).
# Create it once with `npx wrangler kv namespace create OAUTH_KV` and paste the id here.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Not set here, on purpose (same values as the app's VITE_FIREBASE_*):
#   FIREBASE_API_KEY, FIREBASE_AUTH_DOMAIN, FIREBASE_PROJECT_ID
# Production: `npx wrangler secret put <NAME>`. Local: `.dev.vars` (see .dev.vars.example).
